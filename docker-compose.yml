services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: zyntra
      POSTGRES_PASSWORD: zyntra
      POSTGRES_DB: zyntra
    ports:
      - "5432:5432"
    volumes:
      - zyntra-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyntra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zyntra-pg:
